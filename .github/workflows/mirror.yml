name: Mirror to GitLab-SH

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: self-hosted

    steps:
      - name: Mirror repository to GitLab-SH
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_XAMBOOK }}

        run: |
          set -e

          MIRROR_DIR="$(mktemp -d)"
          trap 'rm -rf "$MIRROR_DIR"' EXIT

          GITLAB_URL="https://oauth2:${GITLAB_TOKEN}@git.harish8.com/harish/xambook.git"

          echo "========================================"
          echo "GitHub → GitLab mirror"
          echo "========================================"

          echo "Cloning:"
          echo "https://github.com/${GITHUB_REPOSITORY}.git"

          git clone --mirror \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$MIRROR_DIR/repo.git"

          echo "Clone completed."

          cd "$MIRROR_DIR/repo.git"

          echo "========================================"
          echo "Pushing branches one by one"
          echo "========================================"

          for branch in $(git for-each-ref --format='%(refname:strip=2)' refs/heads/); do
            echo "----------------------------------------"
            echo "Pushing branch: $branch"
            echo "----------------------------------------"

            git -c http.version=HTTP/1.1 push \
              "$GITLAB_URL" \
              "refs/heads/$branch:refs/heads/$branch"
          done

          echo "========================================"
          echo "Pushing tags one by one"
          echo "========================================"

          for tag in $(git for-each-ref --format='%(refname:strip=2)' refs/tags/); do
            echo "----------------------------------------"
            echo "Pushing tag: $tag"
            echo "----------------------------------------"

            git -c http.version=HTTP/1.1 push \
              "$GITLAB_URL" \
              "refs/tags/$tag:refs/tags/$tag"
          done

          echo "========================================"
          echo "Mirror completed successfully"
          echo "========================================"
