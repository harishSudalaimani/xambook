name: Mirror to GitLab-SH

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: self-hosted

    steps:
      - name: Checkout current GitHub files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Push current snapshot to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_XAMBOOK }}

        run: |
          set -e

          echo "========================================"
          echo "GitHub → GitLab snapshot"
          echo "========================================"

          # Remove GitHub's existing Git history
          rm -rf .git

          # Create a completely new repository
          git init
          git branch -M main

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Initial snapshot from GitHub"

          echo "Pushing current snapshot to:"
          echo "https://git.harish8.com/harish/xambook.git"

          git push --force \
            "https://oauth2:${GITLAB_TOKEN}@git.harish8.com/harish/xambook.git" \
            main:main

          echo "========================================"
          echo "Snapshot pushed successfully"
          echo "========================================"
